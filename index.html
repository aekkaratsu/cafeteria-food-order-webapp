<div id="app"></div>
<style>
  /* ปรับสีพื้น ฟอนต์ และรูปแบบรวมของแอปได้จากกลุ่มกฎด้านล่าง */
  #app * { box-sizing: border-box; }
  #app {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F7F5F0;
    color: #201E1A;
    min-height: 100vh;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  button, input, select { font-family: inherit; }
  button { transition: background-color .15s ease, border-color .15s ease, opacity .15s ease, transform .1s ease; }
  button:active { transform: scale(0.97); }

  @keyframes viewEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes cardPop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulseWarn { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  @keyframes numberRise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .view-enter { animation: viewEnter .38s cubic-bezier(.16,1,.3,1) both; }
  .card-in { animation: cardPop .42s cubic-bezier(.16,1,.3,1) both; }
  .pop-in { animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both; }
  .slide-down { animation: slideDown .28s cubic-bezier(.16,1,.3,1) both; }
  .pulse-warn { animation: pulseWarn 1.3s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .view-enter, .card-in, .pop-in, .slide-down, .pulse-warn, .item-card, .item-card:hover { animation: none !important; transition: none !important; transform: none !important; }
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid #E7E3D6;
    background: rgba(247,245,240,0.92); backdrop-filter: blur(6px);
    flex-wrap: wrap; row-gap: 10px; position: sticky; top: 0; z-index: 5;
  }
  .topbar h1 { font-size: 19px; margin: 0; letter-spacing: 0.1px; font-weight: 600; }
  .topbar .who { font-size: 12px; color: #8A8678; }
  .navbtns { display: flex; flex-wrap: wrap; gap: 4px; background: #EEEBE1; padding: 4px; border-radius: 12px; }
  .navbtns button {
    border: none; background: transparent; color: #6B6860;
    padding: 7px 13px; font-size: 13px; cursor: pointer; border-radius: 9px; font-weight: 500;
  }
  .navbtns button.active { background: #FFFFFF; color: #201E1A; box-shadow: 0 1px 3px rgba(32,30,26,0.10); }
  .navbtns button:hover:not(.active) { color: #201E1A; }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 24px 64px; }

  /* ---- หน้าเข้าสู่ระบบ: ปรับขนาดการ์ด ช่องกรอก และปุ่มได้ที่นี่ ---- */
  .login-card {
    max-width: 380px; margin: 90px auto; background: #fff;
    border: 1px solid #EFEBDF; padding: 36px 32px; border-radius: 20px;
    box-shadow: 0 2px 8px rgba(32,30,26,0.05), 0 16px 40px rgba(32,30,26,0.07);
  }
  .login-card h2 { margin: 0 0 4px; font-size: 23px; font-weight: 600; }
  .login-logo { display: block; height: 56px; margin: 0 auto 16px; }
  .topbar-logo { height: 30px; display: block; }
  .login-card p.sub { color: #8A8678; font-size: 13px; margin: 0 0 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: #8A8678; margin-bottom: 5px; font-weight: 500; }
  .field input, .field select {
    width: 100%; padding: 11px 12px; border: 1px solid #E7E3D6; border-radius: 10px;
    font-size: 14px; font-family: inherit; background: #FBFAF6; outline: none;
  }
  .field input:focus, .field select:focus, .form-row input:focus, .menu-row input:focus, .cleanup-row input:focus, .range-box input:focus {
    border-color: #2F6F4E; box-shadow: 0 0 0 3px rgba(47,111,78,0.12); background: #fff;
  }
  .btn-primary {
    width: 100%; padding: 11px; background: #201E1A; color: #fff;
    border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 6px;
  }
  .btn-primary:hover { background: #38352D; }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
  .demo-note {
    margin-top: 18px; font-size: 11px; color: #A6A296; border-top: 1px solid #F0EDE3; padding-top: 12px;
  }
  .err-box { background: #FBEAE8; color: #B03A2E; border: 1px solid #F3D2CD; padding: 9px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }

  /* ---- หน้าเมนูและตะกร้า: ปรับจำนวนคอลัมน์ ระยะห่าง และสีปุ่มได้ที่นี่ ---- */
  .grid2 { display: grid; grid-template-columns: 1fr 320px; gap: 24px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (max-width: 520px) { .menu-grid { grid-template-columns: 1fr; } }
  .item-card {
    background: #fff; border: 1px solid #EFEBDF; border-radius: 16px; padding: 14px;
    display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(32,30,26,0.03);
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .item-card:hover { box-shadow: 0 6px 20px rgba(32,30,26,0.08); transform: translateY(-1px); }
  .item-card .name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .item-card .desc { font-size: 12px; color: #8A8678; flex: 1; margin-bottom: 10px; line-height: 1.45; }
  .item-card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 10px; }
  .item-card .meta > span:first-child { font-weight: 600; }
  .item-card .prep { font-size: 11px; color: #A6A296; }
  .item-card button {
    background: #2F6F4E; color: #fff; border: none; padding: 9px; border-radius: 10px;
    font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .item-card button:hover { background: #255C40; }

  .cart-panel { background: #fff; border: 1px solid #EFEBDF; border-radius: 16px; padding: 18px; height: fit-content; position: sticky; top: 84px; box-shadow: 0 1px 2px rgba(32,30,26,0.03); }
  .cart-panel h3 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  .cart-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 10px; }
  .qty-ctrl { display: flex; align-items: center; gap: 8px; }
  .qty-ctrl button { width: 24px; height: 24px; border: 1px solid #E7E3D6; background: #FBFAF6; border-radius: 8px; cursor: pointer; font-size: 13px; color: #201E1A; }
  .qty-ctrl button:hover { background: #F0EDE3; }
  .cart-total { display: flex; justify-content: space-between; border-top: 1px solid #F0EDE3; padding-top: 12px; margin-top: 8px; font-weight: 600; font-size: 14px; }
  .cart-empty { color: #A6A296; font-size: 13px; }

  .order-type-toggle { display: flex; gap: 6px; margin-bottom: 16px; background: #F5F3EB; padding: 4px; border-radius: 12px; }
  .order-type-toggle button {
    flex: 1; padding: 9px 6px; border: none; background: transparent; border-radius: 9px;
    font-size: 12px; font-weight: 500; color: #6B6860; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .order-type-toggle button .ic { font-size: 16px; }
  .order-type-toggle button.active { background: #fff; color: #201E1A; box-shadow: 0 1px 3px rgba(32,30,26,0.10); }
  .order-type-badge {
    display: inline-block; font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: #E7F1EC; color: #1F5A3E; margin-left: 6px;
  }

  .wait-result { text-align: center; padding: 10px 4px; }
  .wait-result .num { font-size: 36px; font-weight: 700; font-family: ui-monospace, monospace; color: #2F6F4E; margin: 8px 0; }
  .wait-result .label { font-size: 12px; color: #8A8678; }
  .wait-result a { display: block; margin-top: 12px; font-size: 12px; color: #201E1A; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .wait-breakdown { font-size: 12px; color: #8A8678; margin-top: 12px; padding-top: 12px; border-top: 1px solid #F0EDE3; line-height: 1.6; }
  .queue-pos { font-size: 11px; color: #8A8678; margin-bottom: 6px; font-weight: 500; }
  .queue-pos strong { color: #2F6F4E; }

  /* ---- ใบคิว: ส่วนแสดงออเดอร์และสถานะสำหรับพนักงาน ---- */
  .queue-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 760px) { .queue-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .queue-grid { grid-template-columns: 1fr; } }
  .ticket {
    background: #fff; border: 1px solid #EFEBDF; border-radius: 16px; padding: 16px;
    box-shadow: 0 1px 2px rgba(32,30,26,0.03); position: relative; overflow: hidden;
  }
  .ticket::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: repeating-linear-gradient(90deg, #D8D3C2 0 8px, transparent 8px 14px);
  }
  .ticket .num { font-family: ui-monospace, monospace; font-size: 20px; font-weight: 700; }
  .ticket .status { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #F0EDE3; color: #6B6860; }
  .ticket .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; margin-top: 4px; }
  .ticket .who { font-size: 12px; color: #8A8678; margin-bottom: 8px; }
  .ticket ul { list-style: none; padding: 0; margin: 0 0 12px; font-size: 13px; }
  .ticket ul li { padding: 2px 0; }
  .ticket .timeleft { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 12px; }
  .ticket .timeleft .t { font-family: ui-monospace, monospace; font-weight: 700; }
  .ticket button {
    width: 100%; padding: 9px; background: #201E1A; color: #fff; border: none;
    border-radius: 10px; font-size: 12px; font-weight: 500; cursor: pointer;
  }
  .ticket button:hover { background: #38352D; }

  /* ---- จัดการเมนูและสถิติ: ส่วนที่ใช้เพิ่ม แก้ไข และดูข้อมูล ---- */
  .admin-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .admin-tabs button { border: 1px solid #E7E3D6; background: #fff; padding: 7px 13px; font-size: 12px; border-radius: 10px; cursor: pointer; }
  .admin-tabs button.active { background: #201E1A; color: #fff; border-color: #201E1A; }
  .form-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #fff; border: 1px solid #EFEBDF; padding: 16px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(32,30,26,0.03); }
  .form-row input { padding: 9px 10px; border: 1px solid #E7E3D6; border-radius: 9px; font-size: 13px; background: #FBFAF6; }
  .form-row input.wide { grid-column: span 2; }
  .form-row button { grid-column: span 4; padding: 10px; background: #2F6F4E; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500; }
  .form-row button:hover { background: #255C40; }
  .menu-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; row-gap: 8px; background: #fff; border: 1px solid #EFEBDF; padding: 12px 14px; border-radius: 14px; margin-bottom: 8px; font-size: 13px; animation: cardPop .3s ease both; }
  .menu-row .n { flex: 1 1 140px; font-weight: 600; }
  .menu-row input { width: 72px; padding: 6px 8px; border: 1px solid #E7E3D6; border-radius: 8px; font-size: 12px; background: #FBFAF6; }
  .menu-row .rm { color: #B03A2E; cursor: pointer; font-size: 12px; font-weight: 500; background: none; border: none; }
  .menu-row .rm:hover { text-decoration: underline; }

  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .stat-card { background: #fff; border: 1px solid #EFEBDF; border-radius: 16px; padding: 18px; box-shadow: 0 1px 2px rgba(32,30,26,0.03); animation: cardPop .42s cubic-bezier(.16,1,.3,1) both; }
  .stat-card:nth-child(1) { animation-delay: 0ms; }
  .stat-card:nth-child(2) { animation-delay: 40ms; }
  .stat-card:nth-child(3) { animation-delay: 80ms; }
  .stat-card:nth-child(4) { animation-delay: 120ms; }
  .stat-card:nth-child(5) { animation-delay: 160ms; }
  .stat-card:nth-child(6) { animation-delay: 200ms; }
  .stat-card:nth-child(7) { animation-delay: 240ms; }
  .stat-card:nth-child(8) { animation-delay: 280ms; }
  .stat-card .v { font-size: 28px; font-weight: 700; font-family: ui-monospace, monospace; }
  .stat-card .l { font-size: 12px; color: #6B6860; font-weight: 500; margin-top: 2px; }
  .stat-card .sub { font-size: 11px; color: #A6A296; margin-top: 4px; }
  .csv-btn { display: inline-block; background: #201E1A; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; }
  .csv-btn:hover { background: #38352D; }

  .section-title { font-size: 14px; font-weight: 600; margin: 30px 0 12px; color: #201E1A; }
  .hour-bars { background: #fff; border: 1px solid #EFEBDF; border-radius: 16px; padding: 18px; box-shadow: 0 1px 2px rgba(32,30,26,0.03); }
  .hour-row { display: flex; align-items: center; gap: 10px; font-size: 12px; margin-bottom: 7px; }
  .hour-row .hl { width: 42px; font-family: ui-monospace, monospace; color: #8A8678; }
  .hour-row .bar-bg { flex: 1; background: #F0EDE3; border-radius: 4px; height: 10px; overflow: hidden; }
  .hour-row .bar-fg { background: #2F6F4E; height: 100%; border-radius: 4px; }
  .hour-row .hv { width: 24px; text-align: right; font-family: ui-monospace, monospace; color: #6B6860; }

  /* ---- ประวัติออเดอร์: ปรับรูปแบบรายการและรายละเอียดที่กดเปิดได้ ---- */
  .history-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; row-gap: 4px; background: #fff; border: 1px solid #EFEBDF;
    padding: 12px 14px; border-radius: 14px; margin-bottom: 7px; font-size: 13px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(32,30,26,0.03); transition: border-color .15s ease;
    animation: cardPop .3s ease both;
  }
  .history-row:hover { border-color: #D8D3C2; }
  .history-row .hnum { font-family: ui-monospace, monospace; font-weight: 700; }
  .history-row .hname { flex: 1 1 140px; min-width: 0; }
  .history-row .hstatus { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #F0EDE3; color: #6B6860; }
  .history-row .htime { color: #A6A296; font-size: 11px; margin-left: auto; }
  .history-detail {
    background: #FBFAF6; border: 1px solid #EFEBDF; border-radius: 14px; padding: 14px 16px;
    margin: -1px 0 12px; font-size: 12px;
  }
  .history-detail .drow { display: flex; justify-content: space-between; padding: 3px 0; }
  .history-detail ul { margin: 8px 0; padding-left: 16px; }
  .delete-order-btn {
    margin-top: 12px; width: 100%; padding: 8px; background: #fff; color: #B03A2E;
    border: 1px solid #F3D2CD; border-radius: 10px; font-size: 12px; font-weight: 500; cursor: pointer;
  }
  .delete-order-btn:hover { background: #FBEAE8; }

  /* ---- รูปเมนู: ปรับความสูงรูปและขนาดรูปตัวอย่างได้ที่นี่ ---- */
  .item-img-wrap { border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
  .item-img { width: 100%; height: 112px; object-fit: cover; display: block; transition: transform .35s ease; }
  .item-card:hover .item-img { transform: scale(1.06); }
  .item-img-placeholder {
    width: 100%; height: 112px; border-radius: 10px; margin-bottom: 10px; background: #F5F3EB;
    display: flex; align-items: center; justify-content: center; color: #C4C0B0; font-size: 11px;
  }
  .thumb { width: 38px; height: 38px; object-fit: cover; border-radius: 10px; }
  .thumb-placeholder { width: 38px; height: 38px; border-radius: 10px; background: #F5F3EB; }
  .file-btn {
    font-size: 11px; font-weight: 500; border: 1px solid #E7E3D6; background: #FBFAF6; padding: 6px 10px;
    border-radius: 9px; cursor: pointer; display: inline-block; color: #6B6860;
  }
  .file-btn:hover { background: #F0EDE3; }
  .file-btn input { display: none; }

  .empty-note { color: #A6A296; font-size: 13px; padding: 24px 0; text-align: center; }

  /* ---- เกี่ยวกับทีม: แก้รูปแบบการแสดงชื่อและรูปสมาชิกได้ที่นี่ ---- */
  .about-header { text-align: center; padding: 36px 20px 8px; }
  .about-header .about-logo { height: 52px; margin: 0 auto 18px; display: block; }
  .about-header h2 { font-size: 24px; margin: 0 0 6px; font-weight: 600; }
  .about-header p { color: #8A8678; font-size: 13px; margin: 0; }
  .team-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 28px 0 40px; }
  @media (max-width: 760px) { .team-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .team-grid { grid-template-columns: 1fr 1fr; gap: 12px; } }
  .team-card {
    background: #fff; border: 1px solid #EFEBDF; border-radius: 16px; padding: 14px;
    text-align: center; box-shadow: 0 1px 2px rgba(32,30,26,0.03);
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .team-card:hover { box-shadow: 0 8px 24px rgba(32,30,26,0.08); transform: translateY(-2px); }
  .team-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; margin-bottom: 10px; }
  .team-card .tname { font-size: 13px; font-weight: 600; line-height: 1.4; }
  .about-back { text-align: center; padding-bottom: 20px; }
  .about-back a { font-size: 13px; color: #201E1A; text-decoration: underline; cursor: pointer; }

  /* ---- ล้างข้อมูล: ส่วนเก็บถาวรออเดอร์เก่าและกรองช่วงวันที่ ---- */
  .cleanup-box { background: #fff; border: 1px solid #EFEBDF; border-radius: 16px; padding: 18px; margin-top: 10px; box-shadow: 0 1px 2px rgba(32,30,26,0.03); }
  .cleanup-box .size-line { display: flex; gap: 18px; font-size: 12px; color: #8A8678; margin-bottom: 14px; flex-wrap: wrap; }
  .cleanup-box .size-line strong { color: #201E1A; font-family: ui-monospace, monospace; }
  .cleanup-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cleanup-row input { width: 72px; padding: 9px 10px; border: 1px solid #E7E3D6; border-radius: 9px; font-size: 13px; background: #FBFAF6; }
  .cleanup-row button { padding: 9px 16px; background: #B03A2E; color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .cleanup-row button:hover { background: #942F25; }
  .cleanup-msg { margin-top: 12px; font-size: 12px; color: #1F5A3E; background: #E7F1EC; border: 1px solid #CFE6DA; padding: 10px 12px; border-radius: 10px; }
  .archive-note { font-size: 11px; color: #A6A296; margin-top: 10px; line-height: 1.5; }
  .range-box { background: #fff; border: 1px solid #EFEBDF; border-radius: 16px; padding: 16px 18px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(32,30,26,0.03); }
  .range-box input[type="date"] { padding: 7px 9px; border: 1px solid #E7E3D6; border-radius: 9px; font-size: 13px; background: #FBFAF6; }
  .range-clear-btn { background: #fff !important; color: #201E1A !important; border: 1px solid #E7E3D6 !important; }
  .range-clear-btn:hover { background: #F5F3EB !important; }

  /* ---- มือถือ: ปรับ breakpoint และขนาดปุ่มสำหรับหน้าจอเล็ก ---- */
  @media (max-width: 640px) {
    .wrap { padding: 18px 16px 56px; }
    .login-card { width: 88%; margin: 48px auto; padding: 28px 22px; }
    .topbar { padding: 12px 16px; }
    .topbar h1 { font-size: 17px; }
    .form-row { grid-template-columns: 1fr 1fr; }
    .stats-row { grid-template-columns: 1fr; }
    .queue-grid, .menu-grid { gap: 10px; }
    .history-row .htime { flex-basis: 100%; text-align: left; margin-left: 0; }
    /* Prevent iOS Safari auto-zoom on focus (inputs need >=16px font) */
    .field input, .form-row input, .menu-row input, #staff-pin, #login-name {
      font-size: 16px;
    }
    /* Bigger touch targets */
    .qty-ctrl button { width: 30px; height: 30px; font-size: 15px; }
    .navbtns button, .item-card button, .ticket button, .btn-primary { padding-top: 10px; padding-bottom: 10px; }
    .file-btn { padding: 8px 12px; }

      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[ch]));

  // ---- BUGFIX: two devices writing orders around the same time could
  // silently clobber each other (last write wins on the whole array).
  // Re-fetch the freshest copy from storage immediately before applying
  // a local change, so the write window is milliseconds instead of up
  // to a full 4s poll cycle. Doesn't fully eliminate the race (storage
  // has no atomic transactions) but shrinks it a lot. ----
  async function withFreshOrders(mutator) {
    try {
      const r = await window.storage.get(STORAGE_ORDERS, true);
      state.orders = r ? JSON.parse(r.value) : state.orders;
    } catch (e) {}
    mutator(state.orders);
    await saveOrders();
  }

  // ---- Dynamic wait time: single sequential queue, chains off latest
  // active order's projected completion time. This is what makes order 2's
  // quote correctly "stack" on top of order 1's remaining time instead of
  // starting from zero. ----
  function estimateWait(prepTimeMinutes) {
    // คำนวณเวลารอโดยต่อคิวออเดอร์ใหม่หลังออเดอร์ที่กำลังทำอยู่
    const now = Date.now();
    const active = state.orders.filter(o => o.status === "PENDING" || o.status === "IN_PROGRESS");
    let queueFreeAt = now;
    for (const o of active) {
      if (o.estimatedCompleteAt && o.estimatedCompleteAt > queueFreeAt) queueFreeAt = o.estimatedCompleteAt;
    }
    const estimatedStartAt = queueFreeAt;
    const estimatedCompleteAt = estimatedStartAt + prepTimeMinutes * 60000;
    const waitTimeMinutes = Math.max(0, Math.ceil((estimatedCompleteAt - now) / 60000));
    // Transparency data: how much of this wait is "inherited" from orders
    // already ahead in line, vs. this order's own prep time.
    const aheadCount = active.length;
    const aheadMinutes = Math.max(0, Math.round((queueFreeAt - now) / 60000));
    return { estimatedStartAt, estimatedCompleteAt, waitTimeMinutes, aheadCount, aheadMinutes };
  }

  // Live queue position for an already-placed order: how many active
  // orders are still ahead of it right now (recomputed on every call, so
  // it stays accurate even as the queue changes after the order was made).
  function queuePositionFor(order) {
    if (order.status !== "PENDING" && order.status !== "IN_PROGRESS") return null;
    const active = state.orders
      .filter(o => o.status === "PENDING" || o.status === "IN_PROGRESS")
      .sort((a, b) => a.placedAt - b.placedAt);
    const idx = active.findIndex(o => o.id === order.id);
    if (idx === -1) return null;
    return { position: idx + 1, aheadCount: idx, totalActive: active.length };
  }

  function recomputeQueue() {
    const active = state.orders
      .filter(o => o.status === "PENDING" || o.status === "IN_PROGRESS")
      .sort((a, b) => a.placedAt - b.placedAt);
    let cursor = Date.now();
    for (const o of active) {
      const start = o.startedAt && o.startedAt > cursor ? o.startedAt : cursor;
      const complete = start + o.totalPrepTimeMinutes * 60000;
      o.estimatedStartAt = start;
      o.estimatedCompleteAt = complete;
      cursor = complete;
    }
  }

  function nextOrderNumber() {
    return state.orders.length ? Math.max(...state.orders.map(o => o.orderNumber)) + 1 : 1001;
  }

  // ---- Research-oriented statistics helpers ----
  function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }
  function median(arr) {
    if (!arr.length) return 0;
    const s = [...arr].sort((a, b) => a - b);
    const mid = Math.floor(s.length / 2);
    return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
  }
  function stdDev(arr) {
    if (arr.length < 2) return 0;
    const m = mean(arr);
    return Math.sqrt(arr.reduce((a, b) => a + (b - m) ** 2, 0) / (arr.length - 1));
  }

  async function saveArchive() {
    try { await window.storage.set(STORAGE_ARCHIVE, JSON.stringify(state.archive), true); } catch (e) { console.error(e); }
  }

  function computeStats(fromStr, toStr) {
    const ar = state.archive || defaultArchive();
    const hasRangeFilter = !!(fromStr || toStr);
    const fromTs = fromStr ? new Date(fromStr + "T00:00:00").getTime() : null;
    const toTs = toStr ? new Date(toStr + "T23:59:59.999").getTime() : null;

    const inRange = (o) => {
      if (fromTs != null && o.placedAt < fromTs) return false;
      if (toTs != null && o.placedAt > toTs) return false;
      return true;
    };

    const ordersInScope = hasRangeFilter ? state.orders.filter(inRange) : state.orders;
    const completed = ordersInScope.filter(
      o => o.status === "COMPLETED" && o.completedAt && o.estimatedCompleteAt
    );
    // BUGFIX: guard against any malformed/legacy order missing a timestamp
    // producing NaN and silently poisoning every downstream average.
    const durations = completed.map(o => (o.completedAt - o.placedAt) / 60000).filter(Number.isFinite);
    const predictedWaits = completed.map(o => (o.estimatedCompleteAt - o.placedAt) / 60000).filter(Number.isFinite);
    const errors = completed
      .map((o, i) => durations[i] - predictedWaits[i])
      .filter(Number.isFinite);
    const itemCounts = completed.map(o => o.items.reduce((s, i) => s + i.quantity, 0));
    const orderValues = completed.map(o => o.items.reduce((s, i) => s + i.price * i.quantity, 0));

    // Archived (rolled-up) data has no per-order date, so it can't be
    // sliced by a custom range — it's only folded in for the all-time view.
    const useArchive = !hasRangeFilter;
    const arEffective = useArchive ? ar : defaultArchive();

    const hourCounts = { ...arEffective.hourCounts };
    ordersInScope.forEach(o => {
      const h = new Date(o.placedAt).getHours();
      hourCounts[h] = (hourCounts[h] || 0) + 1;
    });

    const liveN = durations.length;
    const n = arEffective.count + liveN;
    const liveSumDuration = durations.reduce((a, b) => a + b, 0);
    const liveSumPredicted = predictedWaits.reduce((a, b) => a + b, 0);
    const liveSumAbsErr = errors.reduce((a, b) => a + Math.abs(b), 0);
    const liveSumItems = itemCounts.reduce((a, b) => a + b, 0);
    const liveSumValue = orderValues.reduce((a, b) => a + b, 0);

    const candidateMins = [arEffective.minDuration, durations.length ? Math.min(...durations) : null].filter(v => v != null);
    const candidateMaxs = [arEffective.maxDuration, durations.length ? Math.max(...durations) : null].filter(v => v != null);

    return {
      n,
      totalOrdersAllTime: arEffective.count + arEffective.cancelledCount + ordersInScope.length,
      cancelledCount: arEffective.cancelledCount + ordersInScope.filter(o => o.status === "CANCELLED").length,
      meanDuration: n ? (arEffective.sumDuration + liveSumDuration) / n : 0,
      // Median & SD need individual data points, which archived orders no
      // longer have (only summed totals survive cleanup) — computed from
      // currently-retained raw orders only, labelled as such in the UI.
      medianDuration: median(durations),
      stdDuration: stdDev(durations),
      minDuration: candidateMins.length ? Math.min(...candidateMins) : 0,
      maxDuration: candidateMaxs.length ? Math.max(...candidateMaxs) : 0,
      meanPredictedWait: n ? (arEffective.sumPredictedWait + liveSumPredicted) / n : 0,
      mae: n ? (arEffective.sumAbsError + liveSumAbsErr) / n : 0,
      meanItemsPerOrder: n ? (arEffective.sumItems + liveSumItems) / n : 0,
      totalRevenue: arEffective.sumValue + liveSumValue,
      avgOrderValue: n ? (arEffective.sumValue + liveSumValue) / n : 0,
      hourCounts,
      liveRawCount: liveN, // how many completed orders still have raw detail (for median/SD caveat)
      archivedCount: arEffective.count,
      hasRangeFilter,
      completedInScope: completed, // exposed so the CSV export can respect the active filter too
    };
  }

  // ---- Image upload: resize/compress client-side before storing as a data URL ----
  function compressImageFile(file, maxWidth = 480, quality = 0.72) {
    if (file.size > MAX_UPLOAD_BYTES) {
      return Promise.reject(new Error("ไฟล์รูปใหญ่เกินไป (สูงสุด 8MB) กรุณาเลือกไฟล์ที่เล็กลง"));
    }
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxWidth / img.width);
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---------------- Actions ----------------
  // ฟังก์ชันในส่วนนี้ถูกเรียกจากปุ่มและช่องกรอกบนหน้าจอ
  window.__cafe = {

      state.user = { name: name.trim(), role: "STAFF" };

    },
    logout() {
      state.user = null; state.view = "login"; state.cart = []; state.orderType = "DINE_IN";
      state.lastWaitResult = null; state.adminForm = { name: "", price: "", prepTimeMinutes: "", description: "", imageDataUrl: "" };
      state.expandedHistoryId = null; state.cleanupMsg = "";
      render();
    },
    setView(v) { state.view = v; render(); },

    addToCart(id) {
      const item = state.menu.find(m => m.id === id);
      if (!item) return;
      const existing = state.cart.find(c => c.menuItemId === id);
      if (existing) existing.quantity += 1;
      else state.cart.push({ menuItemId: id, name: item.name, price: item.price, prepTimeMinutes: item.prepTimeMinutes, quantity: 1 });
      render();
    },
    changeQty(id, delta) {
      const c = state.cart.find(x => x.menuItemId === id);
      if (!c) return;
      c.quantity += delta;
      if (c.quantity <= 0) state.cart = state.cart.filter(x => x.menuItemId !== id);
      render();
    },
    setOrderType(type) { state.orderType = type; render(); },
    async placeOrder() {
      // BUGFIX: a fast double-tap on "สั่งอาหาร" before the first request
      // finished could create two identical orders. Guard with a flag.
      if (!state.cart.length || state.placingOrder) return;
      state.placingOrder = true;
      render();

      // Re-sync with storage right before computing the wait time / order
      // number, so we're queueing behind the freshest known state rather
      // than something up to 4s stale.
      try {
        const r = await window.storage.get(STORAGE_ORDERS, true);
        state.orders = r ? JSON.parse(r.value) : state.orders;
      } catch (e) {}

      const totalPrepTimeMinutes = Math.max(...state.cart.map(c => c.prepTimeMinutes));
      const { estimatedStartAt, estimatedCompleteAt, waitTimeMinutes, aheadCount, aheadMinutes } = estimateWait(totalPrepTimeMinutes);
      const order = {
        id: "o" + Date.now() + Math.random().toString(36).slice(2, 6),
        orderNumber: nextOrderNumber(),
        customerName: state.user.name,
        orderType: state.orderType,
        status: "PENDING",
        items: state.cart.map(c => ({ name: c.name, quantity: c.quantity, price: c.price })),
        totalPrepTimeMinutes,
        estimatedStartAt, estimatedCompleteAt,
        placedAt: Date.now(),
        startedAt: null, completedAt: null,
      };
      state.orders.push(order);
      await saveOrders();
      state.lastWaitResult = {
        orderNumber: order.orderNumber, waitTimeMinutes, orderType: order.orderType,
        aheadCount, aheadMinutes, prepTimeMinutes: totalPrepTimeMinutes,
      };
      state.cart = [];
      state.orderType = "DINE_IN";
      state.placingOrder = false;
      render();
    },
    dismissWaitResult() { state.lastWaitResult = null; render(); },

    async advanceOrder(id) {
      await withFreshOrders((orders) => {
        const order = orders.find(o => o.id === id);
        if (!order) return;
        const flow = { PENDING: "IN_PROGRESS", IN_PROGRESS: "READY", READY: "COMPLETED" };
        const next = flow[order.status];
        if (!next) return;
        order.status = next;
        const now = Date.now();
        if (next === "IN_PROGRESS") order.startedAt = now;
        if (next === "COMPLETED") order.completedAt = now;
        recomputeQueue();
      });
      render();
    },

    updateForm(field, value) { state.adminForm[field] = value; },

    // Permanently remove a single order record — for correcting test data
    // or mistakes. Unlike the cleanup/archive tool, this does NOT fold the
    // order into the rolled-up stats first; it's gone from the numbers too.
    async deleteOrder(id) {
      if (!confirm("ลบออเดอร์นี้ถาวร? จะไม่ถูกนับในสถิติอีกต่อไปและกู้คืนไม่ได้")) return;
      try {

        state.orders = r ? JSON.parse(r.value) : state.orders;

      state.orders = state.orders.filter(o => o.id !== id);
      await saveOrders();

      render();
    },

    setStatsFrom(v) { state.statsFrom = v; render(); },
    setStatsTo(v) { state.statsTo = v; render(); },
    clearStatsRange() { state.statsFrom = ""; state.statsTo = ""; render(); },

    downloadCsv() {
      const s = computeStats(state.statsFrom, state.statsTo);
      let csv = "orderNumber,orderType,placedAt,startedAt,completedAt,actualDurationMinutes,quotedPrepTimeMinutes,predictedWaitMinutes,estimationErrorMinutes,itemCount,orderValue\n";
      s.completedInScope.forEach(o => {
        const actualDur = (o.completedAt - o.placedAt) / 60000;
        const predictedWait = (o.estimatedCompleteAt - o.placedAt) / 60000;
        const itemCount = o.items.reduce((s2, i) => s2 + i.quantity, 0);
        const orderValue = o.items.reduce((s2, i) => s2 + i.price * i.quantity, 0);
        csv += [
          o.orderNumber,
          o.orderType || "DINE_IN",
          new Date(o.placedAt).toISOString(),
          o.startedAt ? new Date(o.startedAt).toISOString() : "",
          new Date(o.completedAt).toISOString(),
          actualDur.toFixed(2),
          o.totalPrepTimeMinutes,
          predictedWait.toFixed(2),
          (actualDur - predictedWait).toFixed(2),
          itemCount,
          orderValue.toFixed(2),
        ].join(",") + "\n";
      });
      const suffix = state.statsFrom || state.statsTo ? `_${state.statsFrom || "start"}_to_${state.statsTo || "now"}` : "";
      triggerDownload(csv, `order-efficiency-log${suffix}.csv`);
    },

    // ---- Data cleanup / archival ----
    setCleanupDays(v) { state.cleanupDays = v; },
    async runCleanup() {
      const days = parseInt(state.cleanupDays, 10);
      if (!Number.isFinite(days) || days < 1) {
        state.cleanupMsg = "กรุณาระบุจำนวนวันที่ต้องการเก็บข้อมูลไว้ (ตัวเลขมากกว่า 0)";
        render();
        return;
      }
      const cutoff = Date.now() - days * 86400000;

      // Sync with the freshest orders first so we don't archive something
      // another device just updated, and don't miss something they added.
      try {
        const r = await window.storage.get(STORAGE_ORDERS, true);
        state.orders = r ? JSON.parse(r.value) : state.orders;
      } catch (e) {}

      const toArchive = state.orders.filter(
        o => (o.status === "COMPLETED" || o.status === "CANCELLED") && o.placedAt < cutoff
      );
      if (toArchive.length === 0) {
        state.cleanupMsg = `ไม่มีออเดอร์ที่เก่ากว่า ${days} วันให้ล้าง`;
        render();
        return;
      }
      if (!confirm(
        `จะเก็บถาวรและลบรายละเอียดออเดอร์เก่า ${toArchive.length} รายการ (เก็บเฉพาะสถิติสรุปไว้ใช้วิเคราะห์ต่อ)\n` +
        `ระบบจะดาวน์โหลด CSV สำรองให้อัตโนมัติก่อนลบ ต้องการดำเนินการต่อหรือไม่?`
      )) return;

      // Auto-backup before destructive action
      triggerDownload(buildBackupCsv(toArchive), `order-archive-backup-${new Date().toISOString().slice(0, 10)}.csv`);

      // Fold into archive aggregate (re-sync archive first too)
      try {
        const r = await window.storage.get(STORAGE_ARCHIVE, true);
        state.archive = r ? JSON.parse(r.value) : (state.archive || defaultArchive());
      } catch (e) {
        state.archive = state.archive || defaultArchive();
      }
      const ar = state.archive;
      toArchive.forEach(o => {
        if (o.status === "CANCELLED") { ar.cancelledCount++; return; }
        if (!o.completedAt || !o.estimatedCompleteAt) return;
        const dur = (o.completedAt - o.placedAt) / 60000;
        const predicted = (o.estimatedCompleteAt - o.placedAt) / 60000;
        if (!Number.isFinite(dur) || !Number.isFinite(predicted)) return;
        ar.count++;
        ar.sumDuration += dur;
        ar.sumPredictedWait += predicted;
        ar.sumAbsError += Math.abs(dur - predicted);
        ar.sumItems += o.items.reduce((s, i) => s + i.quantity, 0);
        ar.sumValue += o.items.reduce((s, i) => s + i.price * i.quantity, 0);
        ar.minDuration = ar.minDuration == null ? dur : Math.min(ar.minDuration, dur);
        ar.maxDuration = ar.maxDuration == null ? dur : Math.max(ar.maxDuration, dur);
        const h = new Date(o.placedAt).getHours();
        ar.hourCounts[h] = (ar.hourCounts[h] || 0) + 1;
      });
      ar.lastCleanupAt = Date.now();
      await saveArchive();

      const archivedIds = new Set(toArchive.map(o => o.id));
      state.orders = state.orders.filter(o => !archivedIds.has(o.id));
      await saveOrders();

      state.cleanupMsg = `เก็บถาวรสำเร็จ: ${toArchive.length} ออเดอร์ (ดาวน์โหลด CSV สำรองแล้ว) — สถิติสรุปยังคงอยู่`;
      render();
    },
  };

  // ฟังก์ชัน render* สร้าง HTML ของแต่ละหน้า แก้ข้อความหรือ layout ได้ที่นี่
  function fmtMoney(n) { return "฿" + Number(n).toFixed(2); }

  function triggerDownload(text, filename) {
    const blob = new Blob([text], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  // General-purpose backup export used before a destructive cleanup —
  // includes both completed and cancelled orders, unlike the efficiency CSV.
  function buildBackupCsv(orders) {
    let csv = "orderNumber,status,orderType,customerName,placedAt,startedAt,completedAt,quotedPrepTimeMinutes,itemCount,orderValue,items\n";
    orders.forEach(o => {
      const itemCount = o.items.reduce((s, i) => s + i.quantity, 0);
      const orderValue = o.items.reduce((s, i) => s + i.price * i.quantity, 0);
      const itemsSummary = o.items.map(i => `${i.quantity}x ${i.name}`).join(" | ").replace(/,/g, ";").replace(/"/g, "'");
      csv += [
        o.orderNumber,
        o.status,
        o.orderType || "DINE_IN",
        `"${(o.customerName || "").replace(/"/g, "'")}"`,
        new Date(o.placedAt).toISOString(),
        o.startedAt ? new Date(o.startedAt).toISOString() : "",
        o.completedAt ? new Date(o.completedAt).toISOString() : "",
        o.totalPrepTimeMinutes,
        itemCount,
        orderValue.toFixed(2),
        `"${itemsSummary}"`,
      ].join(",") + "\n";
    });
    return csv;
  }

  // so the admin can see how close they are to the 5MB per-key ceiling.
  function estimateSizeKB(obj) {
    try { return (new TextEncoder().encode(JSON.stringify(obj)).length / 1024).toFixed(1); }
    catch (e) { return "?"; }
  }

  function timeLeftLabel(order) {
    const remaining = Math.max(0, Math.floor((order.estimatedCompleteAt - Date.now()) / 1000));
    if (order.status === "READY" || order.status === "COMPLETED") return "—";
    if (remaining === 0) return "เลยเวลา";
    const m = Math.floor(remaining / 60), s = remaining % 60;
    return `${m}:${String(s).padStart(2, "0")}`;
  }
  function isOverdue(order) {
    if (order.status === "READY" || order.status === "COMPLETED") return false;
    return Math.max(0, Math.floor((order.estimatedCompleteAt - Date.now()) / 1000)) === 0;
  }

        </div>

        <p style="font-size:13px;color:#56534B;margin-top:20px;">
          ดาวน์โหลดข้อมูลระดับ order (timestamp, เวลาที่ใช้จริง, เวลาที่ระบบประมาณการ, ค่าความคลาดเคลื่อน) ตามช่วงเวลาที่เลือกด้านบน
          เพื่อนำไปวิเคราะห์เปรียบเทียบกับการเข้าคิวแบบเดิมหน้าเคาน์เตอร์
        </p>
        <a class="csv-btn" onclick="__cafe.downloadCsv()">ดาวน์โหลด CSV</a>

        <div class="section-title">ล้างข้อมูลเก่า</div>
        <div class="cleanup-box">
          <div class="size-line">
            <span>ขนาดข้อมูลออเดอร์ปัจจุบัน: <strong>${estimateSizeKB(state.orders)} KB</strong> / 5,120 KB</span>
            <span>ขนาดข้อมูลเมนู: <strong>${estimateSizeKB(state.menu)} KB</strong> / 5,120 KB</span>
            <span>ออเดอร์ที่ยังอยู่ในระบบ: <strong>${state.orders.length}</strong></span>
            <span>เก็บถาวรแล้ว: <strong>${state.archive ? state.archive.count : 0}</strong> ออเดอร์</span>
          </div>
          <div class="cleanup-row">
            <label>เก็บข้อมูลไว้</label>
            <input type="number" min="1" value="${state.cleanupDays}" oninput="__cafe.setCleanupDays(this.value)" />
            <label>วันล่าสุด แล้วล้างส่วนที่เก่ากว่านั้น</label>
            <button onclick="__cafe.runCleanup()">ล้างข้อมูลเก่าตอนนี้</button>
          </div>
          <div class="archive-note">
            เฉพาะออเดอร์ที่ "รับแล้ว" หรือ "ยกเลิก" และเก่ากว่าจำนวนวันที่ระบุเท่านั้นที่จะถูกล้าง (สรุปเป็นสถิติรวมเก็บไว้)
            ต้องการ<strong>ลบทิ้งแบบไม่นับในสถิติเลย</strong> (เช่นแก้ข้อมูลทดสอบผิดพลาด) ให้ไปที่แท็บ "ประวัติออเดอร์" แล้วกดลบรายตัวแทน
          </div>
          ${state.cleanupMsg ? `<div class="cleanup-msg slide-down">${escapeHtml(state.cleanupMsg)}</div>` : ""}
        </div>
      </div>
    `;
  }

  function renderHistory() {
    const all = [...state.orders].sort((a, b) => b.placedAt - a.placedAt);
    if (all.length === 0) {
      return `<div class="wrap"><div class="empty-note">ยังไม่มีประวัติออเดอร์</div></div>`;
    }
    return `
      <div class="wrap">
        <h2 class="serif" style="margin-top:0;">ประวัติออเดอร์ทั้งหมด</h2>
        ${all.map(o => {
          const value = o.items.reduce((s, i) => s + i.price * i.quantity, 0);
          const isOpen = state.expandedHistoryId === o.id;
          const placedStr = new Date(o.placedAt).toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short" });
          const detail = isOpen ? `
            <div class="history-detail slide-down">
              <div class="drow"><span>ลูกค้า</span><span>${escapeHtml(o.customerName)}</span></div>
              <div class="drow"><span>ประเภท</span><span>${ORDER_TYPE_LABEL[o.orderType] || ORDER_TYPE_LABEL.DINE_IN}</span></div>
              <div class="drow"><span>สั่งเมื่อ</span><span>${new Date(o.placedAt).toLocaleString("th-TH")}</span></div>
              <div class="drow"><span>เริ่มทำ</span><span>${o.startedAt ? new Date(o.startedAt).toLocaleString("th-TH") : "—"}</span></div>
              <div class="drow"><span>ส่งมอบ</span><span>${o.completedAt ? new Date(o.completedAt).toLocaleString("th-TH") : "—"}</span></div>
              <div class="drow"><span>เวลาทำโดยประมาณ (quoted)</span><span>${o.totalPrepTimeMinutes} นาที</span></div>
              ${o.completedAt ? `<div class="drow"><span>เวลาที่ใช้จริง</span><span>${((o.completedAt - o.placedAt) / 60000).toFixed(1)} นาที</span></div>` : ""}
              <ul>${o.items.map(i => `<li>${i.quantity}x ${escapeHtml(i.name)} — ${fmtMoney(i.price * i.quantity)}</li>`).join("")}</ul>
              <div class="drow"><strong>รวม</strong><strong>${fmtMoney(value)}</strong></div>
              <button class="delete-order-btn" onclick="__cafe.deleteOrder('${o.id}')">ลบออเดอร์นี้ถาวร (ไม่นับในสถิติ)</button>
            </div>
          ` : "";
          return `
            <div class="history-row" onclick="__cafe.toggleHistory('${o.id}')">
              <span class="hnum">#${o.orderNumber}</span>
              <span class="hname">${escapeHtml(o.customerName)} · ${o.items.reduce((s, i) => s + i.quantity, 0)} รายการ</span>
              <span class="hstatus">${STATUS_LABEL_TH[o.status] || o.status}</span>
              <span class="htime">${placedStr}</span>
            </div>
            ${detail}
          `;
        }).join("")}
      </div>
    `;
  }

  function render() {
    if (state.loading) { app.innerHTML = `<div class="wrap"><p>กำลังโหลด...</p></div>`; return; }

    // About Us is public — logged-out visitors get a standalone page (no app nav).
    if (state.view === "about-us" && !state.user) {
      app.innerHTML = `<div class="view-enter">${renderAboutUs(false)}</div>`;
      return;
    }

    if (!state.user) { app.innerHTML = renderLogin(); return; }

    const isStaff = state.user.role === "STAFF";
    const tabs = isStaff
      ? [["queue", "คิวออเดอร์"], ["admin-menu", "จัดการเมนู"], ["analytics", "สถิติ"], ["history", "ประวัติออเดอร์"], ["menu", "มุมมองลูกค้า"], ["about-us", "เกี่ยวกับเรา"]]
      : [["menu", "เมนู & สั่งอาหาร"], ["my-orders", "ติดตามคำสั่งซื้อ"], ["about-us", "เกี่ยวกับเรา"]];

    const freshView = state.view !== lastRenderView;
    lastRenderView = state.view;

    let body = "";
    if (state.view === "menu") body = renderMenu();
    else if (state.view === "queue") body = renderQueue(freshView);
    else if (state.view === "my-orders") body = renderMyOrders(freshView);
    else if (state.view === "admin-menu") body = renderAdminMenu();
    else if (state.view === "analytics") body = renderAnalytics();
    else if (state.view === "history") body = renderHistory();
    else if (state.view === "about-us") body = renderAboutUs(true);
    else body = renderMenu();

    app.innerHTML = `
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <img class="topbar-logo" src="${LOGO_DATA_URI}" alt="Easy Order" />
          <div class="who">${escapeHtml(state.user.name)} · ${isStaff ? "พนักงาน" : "ลูกค้า"}</div>
        </div>
        <div class="navbtns">
          ${tabs.map(([v, label]) => `<button class="${state.view === v ? "active" : ""}" onclick="__cafe.setView('${v}')">${label}</button>`).join("")}
          <button onclick="__cafe.logout()">ออกจากระบบ</button>
        </div>
      </div>
      <div class="${freshView ? "view-enter" : ""}">${body}</div>
    `;
  }

  // BUGFIX: re-rendering while someone is mid-keystroke in a text field
  // wipes their focus/cursor because render() replaces #app's innerHTML
  // wholesale. Detect that case and defer the visual update.
  function isEditingText() {
    const el = document.activeElement;
    if (!el || !app.contains(el)) return false;
    return el.tagName === "INPUT" && ["text", "number", "password"].includes(el.type);
  }

  // Live sync: poll shared storage so multiple people/devices see the same
  // queue. Uses raw string comparison (cheap) instead of re-parsing +
  // re-stringifying every tick, and only re-renders views that actually
  // depend on the data that changed.
  async function pollSync() {
    try {
      const r = await window.storage.get(STORAGE_ORDERS, true);
      const raw = r ? r.value : "[]";
      if (raw !== lastOrdersRaw) {
        lastOrdersRaw = raw;
        state.orders = JSON.parse(raw);
        const ordersRelevantViews = ["queue", "my-orders", "history", "analytics", "menu"];
        if (state.user && ordersRelevantViews.includes(state.view) && !isEditingText()) render();
      }
    } catch (e) {}
    try {
      const r = await window.storage.get(STORAGE_MENU, true);
      const raw = r ? r.value : lastMenuRaw;
      if (raw !== lastMenuRaw) {
        lastMenuRaw = raw;
        state.menu = JSON.parse(raw);
        const menuRelevantViews = ["menu"]; // skip admin-menu: avoid wiping an in-progress edit form
        if (state.user && menuRelevantViews.includes(state.view) && !isEditingText()) render();
      }
    } catch (e) {}
  }

  loadData().then(render);
  setInterval(pollSync, 4000);
  setInterval(() => {
    if (!state.user) return;
    if (state.view === "queue") {
      const hasActive = state.orders.some(o => o.status === "PENDING" || o.status === "IN_PROGRESS");
      if (hasActive) render();
    } else if (state.view === "my-orders") {
      const hasActive = state.orders.some(
        o => o.customerName === state.user.name && (o.status === "PENDING" || o.status === "IN_PROGRESS")
      );
      if (hasActive) render();
    }
  }, 1000);
})();
</script>
